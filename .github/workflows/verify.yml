name: Verify Dependencies

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4.2.2
        with:
          version: v2026.9.11
          cache: false

      - name: Clone shared AWS SDK
        run: git clone --depth 1 https://github.com/aws/aws-sdk-java-v2 "$HOME/.cache/aws-sdk-java-v2"

      - name: Verify dependencies
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: scripts/verify-deps.sh HEAD^1
