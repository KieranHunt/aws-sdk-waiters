name: Verify Dependencies

on:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4.2.2
        with:
          version: v2026.9.11
          cache: false

      - name: Clone shared AWS SDK
        run: git clone --depth 1 https://github.com/aws/aws-sdk-java-v2 "$HOME/.cache/aws-sdk-java-v2"

      - name: Verify dependencies
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: scripts/verify-deps.sh HEAD^1

  merge:
    needs: verify
    if: always() && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    # Own group so a re-run never cancels an in-flight verify or merge
    concurrency:
      group: ${{ github.workflow }}-merge-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      VERIFY_RESULT: ${{ needs.verify.result }}

    steps:
      - name: Comment on failed verify
        if: needs.verify.result != 'success'
        run: |
          set -euo pipefail
          marker="<!-- merge-job: verify-${VERIFY_RESULT}: ${HEAD_SHA} -->"
          existing="$(gh pr view "$PR_NUMBER" --json comments --jq '.[].body')"
          if grep -qF -- "$marker" <<<"$existing"; then
            exit 0
          fi
          body="Verify did not succeed (conclusion: ${VERIFY_RESULT}), so this Dependabot pull request will not auto-merge.
          ${marker}"
          gh pr comment "$PR_NUMBER" --body "$body"
          gh pr edit "$PR_NUMBER" --add-assignee KieranHunt

      - name: Reject ineligible changed files
        run: |
          set -euo pipefail
          # grep -v exits 1 when nothing is left, which is the eligible case
          offending="$(gh pr diff --name-only "$PR_NUMBER" | grep -vxE 'package\.json|bun\.lock' || true)"
          if [ -z "$offending" ]; then
            echo "Eligible and green; merge path lands in the next slice"
            exit 0
          fi
          marker="<!-- merge-job: ineligible-files: ${HEAD_SHA} -->"
          existing="$(gh pr view "$PR_NUMBER" --json comments --jq '.[].body')"
          # Hidden marker makes re-runs on the same head idempotent
          if grep -qF -- "$marker" <<<"$existing"; then
            exit 0
          fi
          files="$(printf '%s\n' "$offending" | sed "s/.*/\`&\`/" | tr '\n' ' ' | sed 's/ $//; s/ /, /g')"
          body="This Dependabot pull request changes files outside package.json and bun.lock, so it will not auto-merge: ${files}.
          ${marker}"
          gh pr comment "$PR_NUMBER" --body "$body"
          gh pr edit "$PR_NUMBER" --add-assignee KieranHunt
